<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Did I Lock It?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Door">
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1617" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column; the answer card is the whole point, buttons right under it, history last. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #15211f;
  --muted: #5d6b68;
  --line: #d6dedc;
  --door: #1f4e5f;      /* painted front door */
  --brass: #a87a2f;     /* key and thumb-turn */
  --ok: #2f7d4f;
  --stale: #8a6d3b;
  --danger: #c0392b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1617; --surface: #162224; --ink: #e6eeec; --muted: #93a39f; --line: #26373a;
    --door: #7fb6c9; --brass: #d6a95c; --ok: #6fcf94; --stale: #d8b46a; --danger: #ff7b6b; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent; }
.wrap {
  max-width: 460px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(20px, calc(env(safe-area-inset-top, 0px) + 8px));
  padding-bottom: max(40px, calc(env(safe-area-inset-bottom, 0px) + 24px));
  display: grid; gap: 18px;
}
header { display: grid; gap: 2px; }
.eyebrow { font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 30px/1.1 var(--display); text-wrap: balance; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 20px; display: grid; gap: 16px;
}
.status { grid-template-columns: auto 1fr; align-items: center; column-gap: 18px; }
.status figure { grid-column: 1 / -1; }

/* Deadbolt thumb-turn: vertical = unknown, horizontal = locked */
.turn {
  width: 72px; height: 72px; border-radius: 50%;
  background: color-mix(in srgb, var(--brass) 18%, var(--surface));
  border: 3px solid var(--brass); display: grid; place-items: center;
}
.knob {
  width: 16px; height: 52px; border-radius: 8px; background: var(--brass);
  transform: rotate(0deg); transition: transform .6s cubic-bezier(.3,1.4,.5,1);
}
.status[data-state="fresh"] .knob { transform: rotate(90deg); }
.status[data-state="fresh"] .turn { border-color: var(--ok); }

.answer { margin: 0; font: 800 26px/1.15 var(--display); text-wrap: balance; }
.status[data-state="fresh"] .answer { color: var(--ok); }
.status[data-state="stale"] .answer { color: var(--stale); }
.when { margin: 4px 0 0; color: var(--muted); }
.when .mono { font: 500 20px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 6px; }

figure { margin: 0; display: grid; gap: 6px; }
figure img { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: var(--line); cursor: zoom-in; }
figcaption { font-size: 13px; color: var(--muted); }

.actions { display: grid; gap: 10px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 17px/1 var(--body); padding: 18px; border-radius: 14px; cursor: pointer; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px;
}
.btn.primary { background: var(--door); border-color: var(--door); color: var(--bg); font-size: 19px; min-height: 72px; }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn svg { width: 22px; height: 22px; flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0; }

.tip { margin: 0; font-size: 14px; color: var(--muted); }
.tip b { color: var(--ink); font-weight: 600; }

.history h2 { margin: 0; font: 600 13px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.history ol { list-style: none; margin: 0; padding: 0; display: grid; }
.history li {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px;
  padding-block: 10px; border-top: 1px solid var(--line);
}
.history li:first-child { border-top: 0; }
.history .day { min-width: 0; }
.history .t { font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.history .cam { font-size: 12px; color: var(--muted); }
.history .rm {
  appearance: none; border: 0; background: none; color: var(--muted); font: 500 13px var(--body);
  padding: 6px 4px; cursor: pointer; text-decoration: underline;
}
.history .rm.armed { color: var(--danger); }
.history .rm:focus-visible { outline: 2px solid var(--brass); border-radius: 4px; }
.empty { color: var(--muted); margin: 0; }
.note { margin: 0; font-size: 12px; color: var(--muted); text-align: center; }

.viewer {
  position: fixed; inset: 0; background: rgba(0,0,0,.9); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  z-index: 20; cursor: zoom-out;
}
.viewer img { max-width: 100%; max-height: 100%; border-radius: 10px; }

@media (prefers-reduced-motion: reduce) { .knob { transition: none; } .btn:active { transform: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="eyebrow">Front door</span>
    <h1>Did I lock it?</h1>
  </header>

  <section class="card status" id="status" data-state="none" aria-live="polite">
    <div class="turn" aria-hidden="true"><div class="knob"></div></div>
    <div>
      <p class="answer" id="answer">Nothing logged yet.</p>
      <p class="when" id="when">Tap the big button the next time you lock up.</p>
    </div>
    <figure id="photoWrap" hidden>
      <img id="photo" alt="Your photo of the locked door">
      <figcaption id="photoCap"></figcaption>
    </figure>
  </section>

  <div class="actions">
    <button class="btn primary" id="withPhoto" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      I locked it · take photo
    </button>
    <input class="vh" type="file" id="cam" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
    <button class="btn" id="noPhoto" type="button">I locked it, no photo</button>
  </div>

  <p class="tip"><b>The trick:</b> photograph the turned key or the thumb-turn. Later, the photo answers the question your memory can't.</p>

  <section class="card history">
    <h2>Recent</h2>
    <ol id="list"></ol>
    <p class="empty" id="empty">Your lock times show up here.</p>
  </section>

  <p class="note" id="note">Saved on this phone only.</p>
</main>

<script>
(() => {
  const MAX_ENTRIES = 30, MAX_PHOTOS = 5, FRESH_HOURS = 16;
  const $ = id => document.getElementById(id);
  let entries = [];        // newest first: {at: ms, photo?: dataURL}
  let armedAt = null;      // entry waiting for a second "Remove" tap

  // ---------- storage: IndexedDB, one record holding the whole log ----------
  const idb = new Promise((resolve, reject) => {
    const r = indexedDB.open("door", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  async function load() {
    const db = await idb;
    return new Promise(res => {
      const q = db.transaction("kv").objectStore("kv").get("entries");
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => res([]);
    });
  }
  async function save() {
    try {
      const db = await idb;
      await new Promise((res, rej) => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(entries, "entries");
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch { $("note").textContent = "Couldn't save on this phone. Check storage space."; }
  }

  // ---------- time words ----------
  const hm = ms => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dayWord = ms => {
    const d = new Date(ms), t = new Date();
    const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(t) - start(d)) / 864e5);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  };
  const ago = ms => {
    const m = Math.floor((Date.now() - ms) / 6e4);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    const h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return h + " h" + (r ? " " + r + " min" : "") + " ago";
    const d = Math.floor(h / 24);
    return d === 1 ? "1 day ago" : d + " days ago";
  };

  // ---------- render ----------
  function render() {
    const s = $("status"), last = entries[0];
    if (!last) {
      s.dataset.state = "none";
      $("answer").textContent = "Nothing logged yet.";
      $("when").textContent = "Tap the big button the next time you lock up.";
      $("photoWrap").hidden = true;
    } else {
      const fresh = Date.now() - last.at < FRESH_HOURS * 36e5;
      s.dataset.state = fresh ? "fresh" : "stale";
      $("answer").textContent = fresh ? "Yes. You locked it." : "Not logged recently.";
      const when = $("when"); when.textContent = "";
      const t = document.createElement("span"); t.className = "mono"; t.textContent = hm(last.at);
      when.append(t, (dayWord(last.at) === "Today" ? "" : dayWord(last.at) + " · ") + ago(last.at));
      if (last.photo) {
        if ($("photo").src !== last.photo) $("photo").src = last.photo;
        $("photoCap").textContent = "Your proof, taken " + dayWord(last.at).toLowerCase() + " at " + hm(last.at);
        $("photoWrap").hidden = false;
      } else $("photoWrap").hidden = true;
    }

    const list = $("list"); list.textContent = "";
    $("empty").hidden = entries.length > 0;
    entries.slice(0, 8).forEach((e, i) => {
      const li = document.createElement("li");
      const day = document.createElement("span"); day.className = "day"; day.textContent = dayWord(e.at);
      const t = document.createElement("span"); t.className = "t"; t.textContent = hm(e.at);
      li.append(day, t);
      if (i === 0) {
        const rm = document.createElement("button");
        rm.type = "button"; rm.className = "rm" + (armedAt === e.at ? " armed" : "");
        rm.textContent = armedAt === e.at ? "Tap again to remove" : "Remove";
        rm.onclick = () => removeLatest(e.at);
        li.append(rm);
      } else {
        const c = document.createElement("span"); c.className = "cam"; c.textContent = e.photo ? "photo" : "";
        li.append(c);
      }
      list.append(li);
    });
  }

  const trim = list => list.slice(0, MAX_ENTRIES).map((e, i) => (i < MAX_PHOTOS || !e.photo) ? e : { at: e.at });

  async function logLock(photo) {
    armedAt = null;
    const e = { at: Date.now() };
    if (photo) e.photo = photo;
    entries = trim([e, ...entries]);
    render();
    if (navigator.vibrate) try { navigator.vibrate(30); } catch {}
    await save();
  }

  async function removeLatest(at) {
    if (armedAt !== at) {
      armedAt = at; render();
      setTimeout(() => { if (armedAt === at) { armedAt = null; render(); } }, 4000);
      return;
    }
    armedAt = null;
    entries = entries.filter(e => e.at !== at);
    render();
    await save();
  }

  // ---------- photo: shrink before storing ----------
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }

  $("withPhoto").onclick = () => $("cam").click();
  $("noPhoto").onclick = () => logLock(null);
  $("cam").onchange = async ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    const b = $("withPhoto"); b.disabled = true;
    try { await logLock(await shrink(f)); }
    catch { await logLock(null); $("note").textContent = "Photo couldn't be read, so the time was saved without it."; }
    finally { b.disabled = false; }
  };
  $("photo").onclick = () => {
    const v = document.createElement("div"); v.className = "viewer";
    const i = document.createElement("img"); i.src = $("photo").src; i.alt = $("photo").alt;
    v.append(i); v.onclick = () => v.remove(); document.body.append(v);
  };

  // ---------- start ----------
  render();
  load().then(list => { entries = trim(list.slice().sort((a, b) => b.at - a.at)); render(); }).catch(() => {});
  setInterval(render, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
