<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Did I Lock It?</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Door">
<meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1516" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: answer centered in the screen, quiet history under it, actions pinned to the bottom for the thumb. */
:root {
  --bg: #f2f4f3;
  --ink: #16201f;
  --muted: #6b7876;
  --line: #dde3e1;
  --door: #1f4e5f;
  --brass: #a87a2f;
  --ok: #2f7d4f;
  --stale: #8a6d3b;
  --danger: #c0392b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1516; --ink: #e7eeec; --muted: #8d9b98; --line: #233133;
    --door: #8cc0d2; --brass: #d6a95c; --ok: #72d197; --stale: #d8b46a; --danger: #ff7b6b; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.5 var(--body); -webkit-tap-highlight-color: transparent;
}
.app {
  min-height: 100%; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}

/* ---------- answer ---------- */
.hero {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 14px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 40px); padding-bottom: 32px;
}
.turn { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
.turn > * { grid-area: 1 / 1; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring circle { fill: none; stroke-width: 4; }
.track { stroke: var(--line); }
.prog { stroke: var(--ok); stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 327; transition: stroke-dashoffset .4s; }
.knob {
  width: 22px; height: 78px; border-radius: 11px; background: var(--brass);
  transition: transform .7s cubic-bezier(.3,1.4,.5,1);
}
.ripple { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--ok); opacity: 0; pointer-events: none; }
.hero[data-state="fresh"] .prog { stroke-dashoffset: 0; }
.hero[data-state="fresh"] .knob { transform: rotate(90deg); }

.wash {
  position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--ok) 28%, transparent), transparent 62%);
}
.word {
  margin: 4px 0 0; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
  color: var(--muted); font-size: 15px;
}
.word b { font: 700 17px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--brass); margin-left: 4px; }

/* ---------- the lock moment ---------- */
.hero.play .knob { animation: turn .5s cubic-bezier(.55,0,.3,1.35) both; transition: none; }
.hero.play .prog { animation: draw .5s .02s ease-in-out both; transition: none; }
.hero.play .turn { animation: thunk .42s .48s ease-out both; }
.hero.play .ripple { animation: ripple .9s .5s ease-out both; }
.hero.play .ripple.r2 { animation-delay: .66s; }
.hero.play .wash { animation: wash 1.6s .45s ease-out both; }
.hero.play .answer { animation: rise .55s .55s cubic-bezier(.2,.9,.3,1.25) both; }
.hero.play .when { animation: fade .4s .78s both; }
.hero.play .word { animation: pop .6s 1s cubic-bezier(.3,1.7,.5,1) both; }
.hero.play .photo { animation: fade .5s .9s both; }
@keyframes turn   { from { transform: rotate(0deg); } to { transform: rotate(90deg); } }
@keyframes draw   { from { stroke-dashoffset: 327; } to { stroke-dashoffset: 0; } }
@keyframes thunk  { 0% { transform: scale(1); } 30% { transform: scale(.88); } 65% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes ripple { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.3); } }
@keyframes wash   { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
@keyframes rise   { from { opacity: 0; transform: translateY(16px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop    { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }

.answer { margin: 8px 0 0; font: 700 40px/1.05 var(--display); letter-spacing: -.01em; text-wrap: balance; }
.hero[data-state="fresh"] .answer { color: var(--ok); }
.when { margin: 0; color: var(--muted); font-size: 17px; font-variant-numeric: tabular-nums; text-wrap: balance; max-width: 30ch; }
.when b { color: var(--ink); font-weight: 600; }

.photo {
  margin: 10px 0 0; padding: 0; border: 0; background: none; cursor: zoom-in;
  border-radius: 16px; overflow: hidden; width: min(240px, 70vw);
}
.photo img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.undo {
  appearance: none; border: 0; background: none; color: var(--muted);
  font: 500 14px var(--body); padding: 8px; cursor: pointer;
}
.undo.armed { color: var(--danger); }
.remind { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; text-wrap: balance; max-width: 32ch; }
.connect { align-self: center; margin: -12px 0 12px; font-size: 13px; }

/* ---------- history ---------- */
.history { padding-bottom: 24px; }
.history h2 { margin: 0 0 4px; font: 600 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.history ol { list-style: none; margin: 0; padding: 0; }
.history li {
  display: flex; justify-content: space-between; gap: 12px;
  padding-block: 11px; border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.history li span:last-child { color: var(--muted); }

/* ---------- actions ---------- */
.bar {
  position: sticky; bottom: 0; display: grid; gap: 4px;
  padding-top: 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: linear-gradient(to bottom, transparent, var(--bg) 22%);
}
.btn {
  appearance: none; border: 0; border-radius: 18px; width: 100%; min-height: 64px;
  background: var(--door); color: var(--bg);
  font: 600 19px/1 var(--body); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn svg { width: 22px; height: 22px; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .6; }
.link {
  appearance: none; border: 0; background: none; color: var(--muted);
  font: 500 15px var(--body); padding: 12px; cursor: pointer;
}
.btn:focus-visible, .link:focus-visible, .undo:focus-visible, .connect:focus-visible, .photo:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
.ver { justify-self: center; font-size: 11px; color: var(--muted); opacity: .6; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); opacity: 0; }

.viewer {
  position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92);
  display: grid; place-items: center; cursor: zoom-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
}
.viewer img { max-width: 100%; max-height: 100%; border-radius: 12px; }

@media (prefers-reduced-motion: reduce) {
  .knob, .prog { transition: none; } .btn:active { transform: none; }
  .hero.play *, .hero.play .wash { animation: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <main class="hero" id="hero" data-state="none" aria-live="polite">
    <div class="wash" aria-hidden="true"></div>
    <div class="turn" aria-hidden="true">
      <svg class="ring" viewBox="0 0 112 112"><circle class="track" cx="56" cy="56" r="52"/><circle class="prog" cx="56" cy="56" r="52"/></svg>
      <div class="knob"></div>
      <span class="ripple"></span><span class="ripple r2"></span>
    </div>
    <h1 class="answer" id="answer">Did I lock it?</h1>
    <p class="when" id="when">Tap below when you lock up. A photo of the key is the best proof.</p>
    <p class="word" id="word" hidden><span id="wordLabel">Say it out loud:</span><b id="wordText"></b></p>
    <button class="photo" id="photoBtn" type="button" aria-label="Show photo full screen" hidden><img id="photo" alt="Your photo of the locked door"></button>
    <button class="undo" id="seePhoto" type="button" hidden>See that photo</button>
    <button class="undo" id="undo" type="button" hidden>Remove</button>
    <p class="remind" id="remind" hidden></p>
  </main>

  <section class="history" id="history" hidden>
    <h2>Earlier</h2>
    <ol id="list"></ol>
  </section>
  <button class="undo connect" id="connect" type="button" hidden>Connect to paul-hub</button>

  <footer class="bar">
    <button class="btn" id="withPhoto" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      I locked it
    </button>
    <button class="link" id="noPhoto" type="button">Log without photo</button>
    <span class="ver">v6</span>
    <input class="vh" type="file" id="cam" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
  </footer>
</div>

<script>
(() => {
  // Green "Locked" lasts FRESH_HOURS, then resets so an old lock never vouches for a later trip out.
  const MAX_ENTRIES = 30, MAX_PHOTOS = 5, FRESH_HOURS = 3;
  const $ = id => document.getElementById(id);
  let entries = [];        // newest first: {id, at: ms, word, photo?: dataURL}
  let armed = false;       // "Remove" waiting for a second tap
  let code = "", codeBad = false, flushing = false;   // paul-hub (see below)
  let next = null;         // the hub's next reminder: {title, start, remindAt}

  // ---------- storage: IndexedDB, one record holding the whole log ----------
  const idb = new Promise((resolve, reject) => {
    const r = indexedDB.open("door", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
  async function load() {
    const db = await idb;
    return new Promise(res => {
      const q = db.transaction("kv").objectStore("kv").get("entries");
      q.onsuccess = () => res(q.result || []);
      q.onerror = () => res([]);
    });
  }
  async function save() {
    try {
      const db = await idb;
      await new Promise((res, rej) => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(entries, "entries");
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch { $("when").textContent = "Couldn't save on this phone. Check storage space."; }
  }

  // ---------- time words ----------
  const hm = ms => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const dayWord = ms => {
    const d = new Date(ms), t = new Date();
    const start = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((start(t) - start(d)) / 864e5);
    if (diff === 0) return "Today";
    if (diff === 1) return "Yesterday";
    return d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  };
  const ago = ms => {
    const m = Math.floor((Date.now() - ms) / 6e4);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    const h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return h + " h" + (r ? " " + r + " min" : "") + " ago";
    const d = Math.floor(h / 24);
    return d === 1 ? "1 day ago" : d + " days ago";
  };

  // "Reminder 18:15 for Archery"; once the reminder time has come, just the appointment.
  function remindLine() {
    if (!next || !(Date.parse(next.start) > Date.now())) return "";
    const r = Date.parse(next.remindAt), start = Date.parse(next.start);
    if (!(r > Date.now())) return next.title + " at " + hm(start);
    const day = dayWord(r);
    return "Reminder " + (day === "Today" ? "" : (day === dayWord(Date.now() + 864e5) ? "tomorrow" : day) + " ") + hm(r) + " for " + next.title;
  }

  // ---------- render ----------
  function render() {
    const hero = $("hero"), last = entries[0], when = $("when");
    when.textContent = "";
    if (!last) {
      hero.dataset.state = "none";
      $("answer").textContent = "Did I lock it?";
      when.textContent = "Tap below when you lock up. A photo of the key is the best proof.";
      $("photoBtn").hidden = true; $("undo").hidden = true; $("word").hidden = true; $("seePhoto").hidden = true;
    } else {
      const fresh = Date.now() - last.at < FRESH_HOURS * 36e5;
      hero.dataset.state = fresh ? "fresh" : "reset";
      $("answer").textContent = fresh ? "Locked" : "Did I lock it?";
      const day = dayWord(last.at);
      const t = document.createElement("b"); t.textContent = hm(last.at);
      if (fresh) when.append(day === "Today" ? "" : day + " ", t, " · " + ago(last.at));
      else when.append("Last time: " + day.toLowerCase() + " ", t, " · " + ago(last.at));
      $("seePhoto").hidden = fresh || !last.photo;
      $("undo").hidden = !fresh;
      $("word").hidden = !(fresh && last.word);
      if (last.word) {
        $("wordLabel").textContent = Date.now() - last.at < 60000 ? "Say it out loud:" : "Your word:";
        $("wordText").textContent = last.word;
      }
      if (last.photo && $("photo").src !== last.photo) $("photo").src = last.photo;
      $("photoBtn").hidden = !(fresh && last.photo);
      $("undo").textContent = armed ? "Tap again to remove" : "Remove";
      $("undo").classList.toggle("armed", armed);
    }

    const line = remindLine();
    $("remind").textContent = line;
    $("remind").hidden = !line;
    $("connect").hidden = !!code && !codeBad;
    $("connect").textContent = codeBad ? "paul-hub did not know that code. Connect again" : "Connect to paul-hub";

    const older = entries.slice(1, 6), list = $("list");
    list.textContent = "";
    $("history").hidden = older.length === 0;
    for (const e of older) {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = dayWord(e.at);
      const b = document.createElement("span"); b.textContent = hm(e.at);
      li.append(a, b); list.append(li);
    }
  }

  const trim = list => list.slice(0, MAX_ENTRIES).map((e, i) => (i < MAX_PHOTOS || !e.photo) ? e : { id: e.id, at: e.at, word: e.word });

  // ---------- the lock moment: a word to say, a sound, an animation ----------
  const WORDS = ["Otter","Lantern","Pickle","Comet","Walrus","Cactus","Banjo","Waffle","Rocket","Pumpkin",
    "Igloo","Falcon","Mango","Kettle","Penguin","Volcano","Tuba","Pretzel","Llama","Anchor","Meteor","Noodle",
    "Badger","Trumpet","Coconut","Lobster","Tornado","Panda","Cupcake","Dragon","Hedgehog","Jellyfish","Pirate",
    "Robot","Taco","Viking","Yeti","Zebra","Avocado","Bagel","Camel","Dolphin","Flamingo","Gorilla","Hamster",
    "Koala","Moose","Octopus","Parrot","Raccoon","Toucan","Walnut","Biscuit","Crocodile","Donut","Giraffe",
    "Narwhal","Pelican","Sloth","Turtle","Wizard","Popcorn","Snowman","Trombone","Lighthouse","Cannon"];
  function pickWord() {
    const recent = new Set(entries.slice(0, 15).map(e => e.word));
    const pool = WORDS.filter(w => !recent.has(w));
    return pool[Math.floor(Math.random() * pool.length)];
  }

  let ac = null;
  function unlockAudio() {   // must run inside a tap so iOS lets the page make sound
    try {
      // "playback" lets the clack through when the iPhone's silent switch is on.
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const s = ac.createBufferSource();   // a silent blip unlocks output on iOS
        s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
      }
      if (ac.state !== "running") ac.resume();
    } catch {}
  }
  function click(at, freq, gain, len) {
    const n = Math.floor(ac.sampleRate * len), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 2.5; g.gain.value = gain;
    src.connect(f).connect(g).connect(ac.destination); src.start(at);
  }
  function thump(at) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(45, at + .14);
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.9, at + .006); g.gain.exponentialRampToValueAtTime(.0001, at + .22);
    o.connect(g).connect(ac.destination); o.start(at); o.stop(at + .25);
  }
  function lockSound() {
    unlockAudio();
    if (!ac) return;
    const play = () => {
      try {
        const t = ac.currentTime;
        click(t + .04, 4200, .18, .025);   // key starts turning
        click(t + .26, 3600, .14, .02);
        click(t + .49, 2400, .7, .045);    // bolt lands
        thump(t + .49);
      } catch {}
    };
    // After the camera closes iOS can leave audio paused; wait for it to resume.
    if (ac.state === "running") play(); else ac.resume().then(play, () => {});
  }
  function celebrate() {
    const hero = $("hero");
    hero.classList.remove("play"); void hero.offsetWidth; hero.classList.add("play");
    lockSound();
    if (navigator.vibrate) try { navigator.vibrate([8, 470, 40]); } catch {}
    clearTimeout(celebrate.t);
    celebrate.t = setTimeout(() => hero.classList.remove("play"), 2600);
  }

  async function logLock(photo) {
    armed = false;
    const at = Date.now();
    const e = { id: at.toString(36) + "-" + Math.random().toString(36).slice(2, 6), at, word: pickWord() };
    if (photo) e.photo = photo;
    entries = trim([e, ...entries]);
    render();
    celebrate();
    await save();
    tellHub({ id: e.id, at: e.at, word: e.word, photo: !!photo });
  }

  $("undo").onclick = async () => {
    if (!armed) {
      armed = true; render();
      setTimeout(() => { if (armed) { armed = false; render(); } }, 4000);
      return;
    }
    armed = false;
    const gone = entries[0];
    entries = entries.slice(1);
    render();
    await save();
    if (gone && gone.id) tellHub({ remove: gone.id });
  };

  // ---------- photo: shrink before storing ----------
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const max = 900, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("decode")); };
      img.src = url;
    });
  }

  $("withPhoto").onclick = () => { unlockAudio(); $("cam").click(); };
  $("noPhoto").onclick = () => { unlockAudio(); logLock(null); };
  $("cam").onchange = async ev => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    const b = $("withPhoto"); b.disabled = true;
    try { await logLock(await shrink(f)); }
    catch { await logLock(null); }
    finally { b.disabled = false; }
  };
  $("seePhoto").onclick = () => $("photoBtn").onclick();
  $("photoBtn").onclick = () => {
    const v = document.createElement("div"); v.className = "viewer";
    const i = document.createElement("img"); i.src = $("photo").src; i.alt = $("photo").alt;
    v.append(i); v.onclick = () => v.remove(); document.body.append(v);
  };

  // ---------- paul-hub: the lock's time (never the photo), and the next reminder ----------
  // paul-hub reminds Paul to lock up before an appointment in Day, unless a lock came in during the
  // last hour. The code is the to-do's: from a link ending ?c=<code>, from the to-do or Morning on
  // this site, or typed under the history. Without one, nothing leaves the phone. Locks wait in a
  // small queue while offline and go when the phone is back online or the app opens again.
  const HUB = "https://paul-hub.paul-o-a04.workers.dev";
  const CODE_RE = /^[a-z0-9]{16}$/;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
  };
  function takeCode() {
    const params = new URLSearchParams(location.search);
    const fromLink = (params.get("c") || "").trim().toLowerCase();
    if (params.has("c")) {
      params.delete("c");
      const rest = params.toString();
      history.replaceState(history.state, "", location.pathname + (rest ? "?" + rest : "") + location.hash);
    }
    if (CODE_RE.test(fromLink)) { store.set("door.code", fromLink); return fromLink; }
    const own = store.get("door.code");
    if (CODE_RE.test(own || "")) return own;
    for (const k of ["todo.code", "morning.code"]) {   // the to-do and Morning keep it as JSON
      const raw = store.get(k);
      let c = raw;
      try { c = JSON.parse(raw); } catch {}
      if (CODE_RE.test(c || "")) { store.set("door.code", c); return c; }
    }
    return "";
  }
  const queue = () => { try { return JSON.parse(store.get("door.queue")) || []; } catch { return []; } };
  const setQueue = q => store.set("door.queue", q.length ? JSON.stringify(q.slice(-40)) : null);
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  function tellHub(item) {
    let q = queue();
    // A lock removed before it went out never needs to go.
    if (item.remove && q.some(x => x.id === item.remove)) q = q.filter(x => x.id !== item.remove);
    else q.push(item);
    setQueue(q);
    flush();
  }
  async function flush() {
    if (!code || codeBad || flushing || !navigator.onLine) return;
    flushing = true;
    try {
      let sent = false;
      for (let q = queue(); q.length; q = queue()) {
        const item = q[0];
        const body = item.remove ? { id: item.remove } : item;
        let res;
        try {
          res = await fetch(HUB + "/api/door/" + code + (item.remove ? "/remove" : "/lock"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        } catch { break; }                                     // offline: the next open or "online" tries again
        if (res.status === 404) { codeBad = true; break; }    // a wrong code: keep the queue for the right one
        if (res.status >= 500 || res.status === 429) break;
        setQueue(queue().filter(x => !same(x, item)));        // stored, or refused for good (400)
        sent = true;
      }
      if (sent) refreshNext();
    } finally { flushing = false; render(); }
  }
  async function refreshNext() {
    if (!code || codeBad || !navigator.onLine) return;
    try {
      const res = await fetch(HUB + "/api/door/" + code, { cache: "no-store" });
      if (res.status === 404) { codeBad = true; render(); return; }
      if (!res.ok) return;
      const j = await res.json();
      next = j && j.next && Date.parse(j.next.start) && Date.parse(j.next.remindAt) && typeof j.next.title === "string" ? j.next : null;
      store.set("door.next", next ? JSON.stringify(next) : null);
      render();
    } catch {}
  }
  $("connect").onclick = () => {
    const c = (prompt("Your paul-hub code (the to-do's: 16 letters and digits)", "") || "").trim().toLowerCase();
    if (!c) return;
    if (!CODE_RE.test(c)) { alert("That is not the code: it has 16 letters and digits."); return; }
    code = c; codeBad = false; store.set("door.code", c);
    render(); flush(); refreshNext();
  };

  // ---------- start ----------
  code = takeCode();
  try { next = JSON.parse(store.get("door.next")); } catch { next = null; }
  render();
  load().then(list => { entries = trim(list.slice().sort((a, b) => b.at - a.at)); render(); }).catch(() => {});
  setInterval(render, 30000);
  // A Home Screen app resumes without reloading, so check for a newer version whenever it comes back.
  const VERSION = 6;
  const checkUpdate = () => fetch("version.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.json()).then(j => { if (j.v > VERSION) location.reload(); }).catch(() => {});
  checkUpdate();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); checkUpdate(); flush(); refreshNext(); } });
  addEventListener("online", () => { flush(); refreshNext(); });
  flush(); refreshNext();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
